[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[[tool.mypy.overrides]]
module = ["mazegenerator"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.game_logic.mazestate"
warn_unused_ignores = false

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]